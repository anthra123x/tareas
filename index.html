<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <div class="badge">Gestor Personal</div>
      <h1 id="app-title">Lista de Tareas</h1>
      <p class="subtitle">Organiza tus actividades diarias de forma ágil y eficiente</p>
    </header>

    <section class="task-card">
      <form id="task-form" class="task-form" autocomplete="off">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="task-input" 
            placeholder="¿Qué tienes planeado hacer hoy?" 
            required 
            aria-label="Nueva tarea"
          />
        </div>
        <button type="submit" id="add-task-btn" class="btn-primary">
          <span>Agregar</span>
        </button>
      </form>

      <div class="filters-bar">
        <div class="filter-group">
          <button type="button" class="filter-btn active" data-filter="all">Todas</button>
          <button type="button" class="filter-btn" data-filter="pending">Pendientes</button>
          <button type="button" class="filter-btn" data-filter="completed">Completadas</button>
        </div>
        <span id="task-counter" class="task-counter">0 tareas</span>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <footer class="card-footer" id="card-footer">
        <button type="button" id="clear-completed-btn" class="btn-text">
          Limpiar completadas
        </button>
      </footer>
    </section>
  </main>

  <script>
    // Lógica interactiva con persistencia local
    (function () {
      const form = document.getElementById('task-form');
      const input = document.getElementById('task-input');
      const taskList = document.getElementById('task-list');
      const counter = document.getElementById('task-counter');
      const clearBtn = document.getElementById('clear-completed-btn');
      const filterBtns = document.querySelectorAll('.filter-btn');

      let currentFilter = 'all';
      let tasks = [];

      try {
        const stored = localStorage.getItem('lista_tareas_data');
        if (stored) tasks = JSON.parse(stored);
      } catch (e) {
        tasks = [];
      }

      function saveTasks() {
        try {
          localStorage.setItem('lista_tareas_data', JSON.stringify(tasks));
        } catch (e) {}
      }

      function updateCounter() {
        const pendingCount = tasks.filter(t => !t.completed).length;
        counter.textContent = `${pendingCount} pendiente${pendingCount === 1 ? '' : 's'}`;
        clearBtn.style.display = tasks.some(t => t.completed) ? 'inline-block' : 'none';
      }

      function renderTasks() {
        taskList.innerHTML = '';

        const filtered = tasks.filter(task => {
          if (currentFilter === 'pending') return !task.completed;
          if (currentFilter === 'completed') return task.completed;
          return true;
        });

        if (filtered.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty-state';
          empty.textContent = currentFilter === 'all' 
            ? 'No tienes tareas registradas. ¡Agrega una nueva!'
            : 'No hay tareas en esta categoría.';
          taskList.appendChild(empty);
        } else {
          filtered.forEach(task => {
            const li = document.createElement('li');
            li.className = `task-item ${task.completed ? 'completed' : ''}`;
            li.dataset.id = task.id;

            const checkBtn = document.createElement('button');
            checkBtn.className = 'toggle-btn';
            checkBtn.type = 'button';
            checkBtn.setAttribute('aria-label', task.completed ? 'Marcar pendiente' : 'Marcar completada');
            checkBtn.innerHTML = task.completed 
              ? '<svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>'
              : '';

            const textSpan = document.createElement('span');
            textSpan.className = 'task-text';
            textSpan.textContent = task.text;

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.type = 'button';
            deleteBtn.setAttribute('aria-label', 'Eliminar tarea');
            deleteBtn.innerHTML = '<svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>';

            checkBtn.addEventListener('click', () => {
              task.completed = !task.completed;
              saveTasks();
              renderTasks();
            });

            deleteBtn.addEventListener('click', () => {
              tasks = tasks.filter(t => t.id !== task.id);
              saveTasks();
              renderTasks();
            });

            li.appendChild(checkBtn);
            li.appendChild(textSpan);
            li.appendChild(deleteBtn);
            taskList.appendChild(li);
          });
        }

        updateCounter();
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        tasks.unshift({
          id: Date.now().toString(),
          text: text,
          completed: false
        });

        input.value = '';
        saveTasks();
        renderTasks();
      });

      clearBtn.addEventListener('click', () => {
        tasks = tasks.filter(t => !t.completed);
        saveTasks();
        renderTasks();
      });

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          renderTasks();
        });
      });

      renderTasks();
    })();
  </script>
</body>
</html>
